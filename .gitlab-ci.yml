variables:
    PIPELINE_NAME: "Waymate CI"
    BUN_INSTALL_CACHE_DIR: "$CI_PROJECT_DIR/.bun-cache"
    # Built by ci/build-image.sh; ci-image-check fails if the tag drifts from package.json/bun.lock.
    CI_IMAGE: "gitlab.fi.muni.cz:5050/xcvejn2/splujazda-sketch/ci:bun1.3.13-pw1.61.0-202610032024"

workflow:
    name: $PIPELINE_NAME
    rules:
        - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
          when: never
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          variables:
              PIPELINE_NAME: "Waymate MR Pipeline"
        - if: $CI_PIPELINE_SOURCE == "push"
          variables:
              PIPELINE_NAME: "Waymate Branch Pipeline"

.bun-cache: &bun_cache
    # Cache the global bun cache to speed up downloads,
    # but do NOT cache node_modules because zipping 100k files is slower than bun install.
    key:
        files:
            - bun.lock
    paths:
        - .bun-cache/
    policy: pull

.turbo-cache: &turbo_cache
    paths:
        - .turbo/
        - apps/*/.turbo/
        - packages/*/.turbo/

stages:
    - static-analysis
    - test
    - build
    - e2e
    - deploy

default:
    image: oven/bun:1.3.13
    tags:
        - local-pc
    interruptible: true
    cache:
        - *bun_cache
    before_script:
        - bun --version
        - bun install

lint:
    stage: static-analysis
    cache:
        - <<: *bun_cache
          policy: pull-push
          when: always
    script:
        - bun run lint

format:
    stage: static-analysis
    script:
        - bun run format:check

typecheck:
    stage: static-analysis
    cache:
        - *bun_cache
        - <<: *turbo_cache
          key: ${CI_COMMIT_REF_SLUG}-turbo-typecheck
          fallback_keys:
              - main-turbo-typecheck
    script:
        - bun run typecheck

i18n-check:
    stage: static-analysis
    script:
        - bun run --cwd apps/web i18n:check

ci-image-check:
    stage: static-analysis
    before_script: []
    cache: []
    script:
        - . ci/versions.sh
        - |
            case "$CI_IMAGE" in
                *":$CI_IMAGE_TAG-"*) echo "CI image matches $CI_IMAGE_TAG" ;;
                *)
                    echo "CI_IMAGE ($CI_IMAGE) does not match package.json/bun.lock ($CI_IMAGE_TAG)."
                    echo "Run ci/build-image.sh and update CI_IMAGE in .gitlab-ci.yml."
                    exit 1
                    ;;
            esac

test:
    stage: test
    services:
        - name: postgres:18
          alias: postgres
        - name: redis:7-alpine
          alias: redis
    variables:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: waymate_test
        # Test env. The API's vitest globalSetup migrates this DB; per-test
        # isolation is TRUNCATE in test/setup.ts. config/env.ts requires the
        # auth/origin vars even though the test suite never sends real email.
        DATABASE_URL: "postgres://postgres:postgres@postgres:5432/waymate_test"
        REDIS_URL: "redis://redis:6379"
        BETTER_AUTH_URL: "http://localhost:3000"
        WEB_ORIGIN: "http://localhost:5173"
        RESEND_API_KEY: "re_ci_dummy_key"
        NODE_ENV: "test"
    script:
        - bun run --cwd apps/api scripts/wait-for-db.ts
        - bun run test

test-web:
    stage: test
    script:
        - bun run --cwd apps/web test

e2e:
    stage: e2e
    # Chromium and its system libraries are preinstalled in the CI image.
    image: $CI_IMAGE
    needs:
        - build
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    services:
        - name: postgres:18
          alias: postgres
        - name: redis:7-alpine
          alias: redis
    variables:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres
        # Playwright boots its own API (port 3010) + web (5174) inside this job
        # container via its `webServer` config, so only Postgres is an external
        # service. global-setup.ts (run by start-api.ts) recreates
        # `spolujazda_e2e_db` on this service and runs db:reset (migrate + seed).
        E2E_DATABASE_URL: "postgres://postgres:postgres@postgres:5432/spolujazda_e2e_db"
        REDIS_URL: "redis://redis:6379"
    script:
        - bun run --cwd apps/api scripts/wait-for-db.ts
        - bun run --cwd e2e test
    artifacts:
        when: on_failure
        paths:
            - e2e/playwright-report/
            - e2e/test-results/
        expire_in: 1 week

build:
    stage: build
    variables:
        VITE_MAPBOX_ACCESS_TOKEN: "pk.e2e_dummy_token"
    cache:
        - *bun_cache
        - <<: *turbo_cache
          key: ${CI_COMMIT_REF_SLUG}-turbo-build
          fallback_keys:
              - main-turbo-build
    script:
        - bun run build
    artifacts:
        paths:
            - apps/web/dist/
            - apps/api/dist/
        expire_in: 1 day

migration-drift:
    stage: static-analysis
    script:
        - cp -r apps/api/drizzle /tmp/drizzle-before
        - bun run --cwd apps/api db:generate
        - |
            if ! diff -r /tmp/drizzle-before apps/api/drizzle; then
                echo "Schema in apps/api/src/db/schema/ drifted from apps/api/drizzle/."
                echo "Run 'bun run --cwd apps/api db:generate' locally and commit the new migration."
                exit 1
            fi

openapi-drift:
    stage: static-analysis
    variables:
        # openapi:dump imports the whole app, so config/env.ts requires these —
        # but nothing connects at import time (DB/Redis clients are lazy), so
        # dummy values are enough.
        DATABASE_URL: "postgres://ci:ci@localhost:5432/ci"
        REDIS_URL: "redis://localhost:6379"
        BETTER_AUTH_URL: "http://localhost:3000"
        WEB_ORIGIN: "http://localhost:5173"
        RESEND_API_KEY: "re_ci_dummy_key"
    script:
        - cp apps/api/openapi.json /tmp/openapi-before.json
        - bun run --cwd apps/api openapi:dump
        # The dump writes compact JSON; the committed file is Prettier-formatted.
        - bun run prettier --write apps/api/openapi.json
        - |
            if ! diff -u /tmp/openapi-before.json apps/api/openapi.json; then
                echo "apps/api/openapi.json drifted from the API routes/schemas."
                echo "Run 'bun run --cwd apps/api openapi:dump && bun run format' locally, commit the spec, and re-run 'bun run --cwd apps/web codegen' if the client changed."
                exit 1
            fi

trigger-deployments:
    stage: deploy
    image: alpine:latest
    before_script: [] # Skips bun install
    cache: []
    dependencies: []
    interruptible: false
    timeout: 15m
    variables:
        PRODUCTION_API_URL: "https://api.wezmesa.world"
        PRODUCTION_WEB_URL: "https://wezmesa.world"
    rules:
        - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    script:
        - apk add --no-cache curl jq
        - curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
        - curl -fsS -X POST "$CLOUDFLARE_DEPLOY_HOOK_URL"
        - sh scripts/wait-for-deploy.sh "API=$PRODUCTION_API_URL/health" "Web=$PRODUCTION_WEB_URL/version.json"
